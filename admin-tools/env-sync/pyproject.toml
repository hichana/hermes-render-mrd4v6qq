[project]
name = "hermes-env-sync"
version = "0.1.0"
description = "Admin CLI: upsert per-client env vars into a deployed Hermes instance's /opt/data/.env over SSH, then restart and verify the gateway picked them up."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
hermes-env-sync = "hermes_env_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_env_sync"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
