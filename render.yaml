# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Hermes Agent on Render.
# https://github.com/NousResearch/hermes-agent
#
# Single web service built from the local Dockerfile, which extends the
# upstream Hermes image with a Caddy path multiplexer for Render's single
# exposed port. This image carries no Render account access — provisioning
# and managing Render resources is an admin-only action taken outside the
# deployed agent.
#
# Inside the container, s6-overlay supervises both processes: the
# dashboard runs as an s6 service, and the gateway runs as the container's
# main program (registered as the supervised `gateway-default` service, so
# it auto-restarts on crash). Render's public URL serves the dashboard on
# port 10000; persistent state lives on a 5 GB disk mounted at /opt/data
# (HERMES_HOME default).
#
# To upgrade Hermes, follow UPGRADING.md — do not just bump HERMES_IMAGE
# and redeploy. The v2026.5.7 -> v2026.7.7.2 bump was exactly that, and it
# silently broke the container's boot (upstream moved to s6-overlay); the
# service ran wedged for 8 days while still looking healthy, because the
# healthCheckPath below is served by the dashboard, not the gateway.

services:
  - type: web
    name: hermes
    runtime: docker
    region: oregon
    plan: standard
    # Render builds the image from this repo's Dockerfile on every deploy.
    # The Dockerfile FROMs the pinned upstream Hermes image and adds the
    # Caddy path multiplexer. It deliberately does NOT override the
    # image's ENTRYPOINT (/init + main-wrapper.sh under s6-overlay); boot
    # work runs as a cont-init hook instead. Leave `dockerCommand` unset —
    # setting it replaces the Dockerfile's `CMD ["gateway", "run"]`.
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    # Served by the dashboard, and reachable without auth by design (the
    # rest of the dashboard is gated). So this probes the dashboard, NOT
    # the gateway: a wedged container whose dashboard still answers will
    # pass this check. See the smoke test for a real liveness assertion.
    healthCheckPath: /api/status

    disk:
      name: hermes-data
      mountPath: /opt/data
      sizeGB: 5

    envVars:
      # The Blueprint only carries vars that change how the container boots.
      # All provider keys, tool keys, and chat platform tokens are set
      # through the Hermes dashboard (API Keys tab), which writes them to
      # /opt/data/.env on the disk.

      # Dashboard s6 service. Runs whenever HERMES_DASHBOARD is truthy;
      # s6 supervises it and restarts it on crash.
      #
      # On a non-loopback bind (0.0.0.0, as here) the dashboard's auth gate
      # engages and REQUIRES a registered auth provider — it refuses to bind
      # otherwise, which fails the health check rather than exposing an
      # unauthenticated dashboard. Set the basic-auth vars below.
      # HERMES_DASHBOARD_INSECURE no longer disables the gate (June 2026
      # hardening); it is accepted but ignored.
      - key: HERMES_DASHBOARD
        value: "1"
      # Deliberately 0.0.0.0, NOT 127.0.0.1 — even though only Caddy talks
      # to the dashboard now.
      #
      # The auth gate engages on *non-loopback* binds. Caddy forwards the
      # public internet to this dashboard, so it is public in every way that
      # matters; binding loopback would silently disarm the gate and serve
      # an unauthenticated dashboard (holding your provider keys and a PTY)
      # to anyone with the URL. Render only routes port 10000, so binding
      # 0.0.0.0 here exposes nothing extra — the port is not published.
      - key: HERMES_DASHBOARD_HOST
        value: "0.0.0.0"
      # Must not be 10000; that is Caddy's. The caddy service refuses to
      # start if this collides.
      - key: HERMES_DASHBOARD_PORT
        value: "10001"

      # Required for a public (non-loopback) dashboard: without an auth
      # provider the dashboard refuses to bind and the service fails its
      # health check. Marked sync: false so they are set per-service from
      # the Environment tab and never overwritten by a Blueprint sync.
      #
      # The dashboard is an admin surface: it holds your provider keys and,
      # with HERMES_DASHBOARD_TUI=1, a PTY into the container.
      - key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        sync: false
      - key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        sync: false
      # Signing secret for dashboard sessions.
      - key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
        sync: false
      # Exposes a Chat tab in the dashboard that embeds the full Hermes TUI
      # over a server-side PTY + xterm.js. This is how you chat with the
      # agent without a real terminal on the host side.
      - key: HERMES_DASHBOARD_TUI
        value: "1"

      # Generated once at first deploy. Reuse this value as API_SERVER_KEY
      # in the dashboard if you later opt into the OpenAI-compatible API
      # server (API_SERVER_ENABLED=true).
      - key: HERMES_GATEWAY_TOKEN
        generateValue: true
